<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Satellite Live</title>
  
  <!-- Moteur Leaflet (Ultra léger & ultra rapide sur mobile) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      background: #0b0f19;
    }

    /* Barre supérieure */
    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 14px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1.2s infinite;
    }

    .stats {
      font-size: 12px;
      color: #cbd5e1;
    }

    .btn {
      background: #0284c7;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }

    /* Marqueurs d'avions */
    .plane-icon {
      color: #facc15;
      font-size: 16px;
      text-shadow: 0 0 3px #000;
      transition: transform 0.3s ease;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="brand">
      <div class="pulse"></div>
      RADAR SATELLITE
    </div>
    <div class="stats">
      Vols : <strong id="flightCount">0</strong>
    </div>
    <button class="btn" onclick="fetchLiveFlights()">ACTUALISER</button>
  </div>

  <div id="map"></div>

  <script>
    // Initialisation de la carte centrée sur le monde
    const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);

    // Couche Satellite HD Monde (ArcGIS Satellite)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'ArcGIS Satellite'
    }).addTo(map);

    // Repères des noms de villes & pays superposés
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    const markersGroup = L.layerGroup().addTo(map);

    // Récupération des avions réels
    async function fetchLiveFlights() {
      try {
        const res = await fetch('https://opensky-network.org/api/states/all');
        const data = await res.json();

        if (data && data.states) {
          markersGroup.clearLayers();

          // On filtre les vols valides (limité à 300 pour la vitesse sur téléphone)
          const flights = data.states
            .filter(f => f[5] !== null && f[6] !== null)
            .slice(0, 350);

          document.getElementById('flightCount').innerText = flights.length;

          flights.forEach(flight => {
            const callsign = flight[1] ? flight[1].trim() : 'INCONNU';
            const country = flight[2];
            const lon = flight[5];
            const lat = flight[6];
            const alt = flight[7] ? Math.round(flight[7]) + ' m' : 'N/A';
            const speed = flight[9] ? Math.round(flight[9] * 3.6) : 0;
            const heading = flight[10] || 0;

            // Création de l'icône d'avion orientée selon son cap
            const icon = L.divIcon({
              className: 'custom-plane-icon',
              html: `<div class="plane-icon" style="transform: rotate(${heading}deg);">✈</div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            });

            // Ajout du marqueur sur la carte satellite
            const marker = L.marker([lat, lon], { icon: icon });

            // Fenêtre d'information au clic
            marker.bindPopup(`
              <div style="font-family: sans-serif; font-size: 13px;">
                <strong style="color: #0284c7; font-size: 14px;">VOL ${callsign}</strong><br/>
                <b>Pays :</b> ${country}<br/>
                <b>Altitude :</b> ${alt}<br/>
                <b>Vitesse :</b> ${speed} km/h<br/>
                <b>Cap :</b> ${heading}°
              </div>
            `);

            markersGroup.addLayer(marker);
          });
        }
      } catch (err) {
        console.error("Erreur de récupération des données :", err);
      }
    }

    // Chargement au démarrage + mise à jour auto toutes les 15s
    fetchLiveFlights();
    setInterval(fetchLiveFlights, 15000);
  </script>
</body>
</html>
