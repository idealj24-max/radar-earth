<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Satellite Live & SNIM</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      background: #0b0f19;
    }

    /* Panneau de contrôle */
    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 12px;
      border-radius: 12px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 13px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1.2s infinite;
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    .btn {
      background: #0284c7;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-gps {
      background: #10b981;
    }

    .btn-snim {
      background: #f59e0b;
    }

    .plane-icon, .train-icon {
      font-size: 18px;
      line-height: 1;
      text-shadow: 0 0 4px #000;
      display: inline-block;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="brand">
      <div class="pulse"></div>
      RADAR & SNIM LIVE
    </div>
    <div class="controls">
      <button class="btn btn-gps" onclick="locateUser()">🎯 MA POSITION</button>
      <button class="btn btn-snim" onclick="focusSNIM()">🚂 TRAIN SNIM</button>
      <button class="btn" onclick="fetchLiveFlights()">🔄</button>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // Carte Satellite ArcGIS HD
    const map = L.map('map', { zoomControl: false }).setView([20.5, -10], 5);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'ArcGIS Satellite'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    const flightGroup = L.layerGroup().addTo(map);
    const snimGroup = L.layerGroup().addTo(map);

    // 1. TRACÉ DE LA VOIE FERRÉE DE LA SNIM (Zouérate ➔ Choum ➔ Nouadhibou)
    const snimRailway = [
      [22.7441, -12.4789], // Zouérate
      [22.6800, -12.7000],
      [21.3000, -13.0000], // Choum
      [21.3200, -14.5000],
      [21.0000, -16.0000],
      [20.9322, -17.0342]  // Nouadhibou Port
    ];

    // Ligne rouge/jaune pour la voie ferrée
    const railwayLine = L.polyline(snimRailway, {
      color: '#f59e0b',
      weight: 4,
      dashArray: '8, 8',
      opacity: 0.9
    }).addTo(snimGroup);

    railwayLine.bindPopup("<b>Voie Ferrée SNIM</b><br/>Zouérate ↔ Nouadhibou (704 km)");

    // Train de la SNIM en mouvement simulé
    let trainIndex = 0;
    const trainIcon = L.divIcon({
      className: 'custom-icon',
      html: `<div class="train-icon">🚂</div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    const trainMarker = L.marker(snimRailway[0], { icon: trainIcon }).addTo(snimGroup);
    
    // Déplacement dynamique du train le long des rails
    function moveTrain() {
      trainIndex = (trainIndex + 1) % snimRailway.length;
      const nextPos = snimRailway[trainIndex];
      trainMarker.setLatLng(nextPos);

      // Simulation de détection d'obstacles (ex: En sable/animaux)
      const hasObstacle = Math.random() < 0.3; // 30% de chance d'alerte
      const obstacleInfo = hasObstacle 
        ? "<br/><span style='color:red; font-weight:bold;'>⚠️ ALERTE OBSTACLE : Ensablement détecté à 5km !</span>" 
        : "<br/><span style='color:green;'>✅ Voie libre - Aucune obstruction.</span>";

      trainMarker.bindPopup(`
        <div style="font-family: sans-serif; font-size: 13px;">
          <strong style="color: #f59e0b;">🚂 TRAIN DE MINERAI SNIM</strong><br/>
          <b>Statut :</b> En transit<br/>
          <b>Vitesse estimée :</b> 45 km/h
          ${obstacleInfo}
        </div>
      `);
    }

    setInterval(moveTrain, 8000); // Le train avance toutes les 8s

    function focusSNIM() {
      map.flyTo([21.3000, -14.5000], 7);
      trainMarker.openPopup();
    }

    // 2. GÉOLOCALISATION UTILISATEUR
    let userMarker = null;

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);

          userMarker = L.circleMarker([lat, lng], {
            radius: 8,
            color: '#ffffff',
            fillColor: '#10b981',
            fillOpacity: 1
          }).addTo(map);

          userMarker.bindPopup("<b>📍 Vous êtes ici</b>").openPopup();
          map.flyTo([lat, lng], 13);
        }, () => {
          alert("Affiche la permission GPS sur ton téléphone pour activer la géolocalisation !");
        });
      }
    }

    // 3. RADAR AVIONS (Données en direct sans dépendances bloquantes)
    async function fetchLiveFlights() {
      try {
        // Source ADS-B globale directe
        const res = await fetch('https://api.adsb.lol/v2/lat/20/lon/0/dist/3000');
        const data = await res.json();

        if (data && data.ac) {
          flightGroup.clearLayers();
          const flights = data.ac.filter(f => f.lat && f.lon).slice(0, 300);

          flights.forEach(flight => {
            const callsign = flight.flight ? flight.flight.trim() : 'AVION';
            const track = flight.track || 0;

            const icon = L.divIcon({
              className: 'custom-icon',
              html: `<div class="plane-icon" style="transform: rotate(${track - 45}deg);">✈️</div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            });

            const marker = L.marker([flight.lat, flight.lon], { icon: icon });
            marker.bindPopup(`
              <div style="font-family: sans-serif; font-size: 13px;">
                <strong style="color: #0284c7;">✈️ VOL ${callsign}</strong><br/>
                <b>Altitude :</b> ${flight.alt_baro || 'N/A'} ft<br/>
                <b>Vitesse :</b> ${flight.gs ? Math.round(flight.gs * 1.852) : 0} km/h
              </div>
            `);
            flightGroup.addLayer(marker);
          });
        }
      } catch (err) {
        console.log("Tentative de reconnexion radar...");
      }
    }

    fetchLiveFlights();
    setInterval(fetchLiveFlights, 15000);
  </script>
</body>
</html>
