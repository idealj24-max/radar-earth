<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Satellite Live</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      background: #0b0f19;
    }

    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 14px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1.2s infinite;
    }

    .stats {
      font-size: 12px;
      color: #cbd5e1;
    }

    .btn {
      background: #0284c7;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }

    .plane-icon {
      font-size: 18px;
      line-height: 1;
      text-shadow: 0 0 4px #000;
      display: inline-block;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="brand">
      <div class="pulse"></div>
      RADAR SATELLITE
    </div>
    <div class="stats">
      Vols : <strong id="flightCount">Chargement...</strong>
    </div>
    <button class="btn" onclick="fetchLiveFlights()">ACTUALISER</button>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);

    // Fonds Satellite HD + Noms des pays/villes
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'ArcGIS Satellite'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    const markersGroup = L.layerGroup().addTo(map);

    async function fetchLiveFlights() {
      try {
        // Source ADS-B ouverte et ultra rapide sans restriction CORS
        const res = await fetch('https://api.adsb.lol/v2/lat/20/lon/0/dist/3000');
        const data = await res.json();

        if (data && data.ac) {
          markersGroup.clearLayers();

          // Filtrer les avions avec positions valides (limité aux 400 plus proches)
          const flights = data.ac
            .filter(f => f.lat !== undefined && f.lon !== undefined)
            .slice(0, 400);

          document.getElementById('flightCount').innerText = flights.length;

          flights.forEach(flight => {
            const callsign = flight.flight ? flight.flight.trim() : 'INCONNU';
            const alt = flight.alt_baro ? flight.alt_baro + ' ft' : 'Sol';
            const speed = flight.gs ? Math.round(flight.gs * 1.852) + ' km/h' : '0 km/h';
            const track = flight.track || 0;

            const icon = L.divIcon({
              className: 'custom-icon',
              html: `<div class="plane-icon" style="transform: rotate(${track - 45}deg);">✈️</div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            });

            const marker = L.marker([flight.lat, flight.lon], { icon: icon });

            marker.bindPopup(`
              <div style="font-family: sans-serif; font-size: 13px; color: #0f172a;">
                <strong style="color: #0284c7; font-size: 14px;">✈️ VOL ${callsign}</strong><br/>
                <b>Altitude :</b> ${alt}<br/>
                <b>Vitesse :</b> ${speed}<br/>
                <b>Cap :</b> ${track}°
              </div>
            `);

            markersGroup.addLayer(marker);
          });
        }
      } catch (err) {
        console.error("Erreur de synchronisation :", err);
        document.getElementById('flightCount').innerText = "Erreur API";
      }
    }

    fetchLiveFlights();
    setInterval(fetchLiveFlights, 12000);
  </script>
</body>
</html>
