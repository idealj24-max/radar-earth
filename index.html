<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Ferroviaire SNIM Live</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      background: #0b0f19;
    }

    /* Panneau supérieur avec support d'alerte rouge clignotant */
    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(245, 158, 11, 0.5);
      padding: 10px 12px;
      border-radius: 12px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: background 0.3s, border-color 0.3s;
    }

    /* Animation Clignotement en cas d'obstacle */
    .top-panel.alert-active {
      animation: alertFlash 0.8s infinite alternate;
    }

    @keyframes alertFlash {
      from {
        background: rgba(220, 38, 38, 0.95);
        border-color: #ef4444;
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      }
      to {
        background: rgba(15, 23, 42, 0.95);
        border-color: rgba(245, 158, 11, 0.5);
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #f59e0b;
      font-size: 13px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 1.2s infinite;
    }

    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #334155;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-gps { background: #059669; }
    .btn-track { background: #d97706; }
    .btn-track.active { background: #dc2626; border-color: #f87171; }

    .train-icon {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="top-panel" id="topPanel">
    <div class="brand">
      <div class="pulse" id="statusPulse"></div>
      <span id="panelTitle">RADAR SNIM LIVE</span>
    </div>
    <div class="controls">
      <button class="btn btn-gps" onclick="locateUser()">🎯 MA POSITION</button>
      <button class="btn btn-track" id="btnAutoTrack" onclick="toggleAutoTrack()">🎥 SUIVI AUTO: OFF</button>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. CARTE SATELLITE ARCGIS HD
    const map = L.map('map', { zoomControl: false }).setView([21.3000, -14.5000], 7);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'ArcGIS Satellite'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // 2. TRACÉ EXACT DE LA VOIE FERRÉE SNIM (704 KM)
    const snimTrackPoints = [
      [22.7441, -12.4789], // Zouérate (Mines)
      [22.6800, -12.7000], // F'Dérik
      [22.1000, -12.8500], 
      [21.3000, -13.0000], // Choum
      [21.3200, -14.5000], // Pass de Choum
      [21.2000, -15.5000], 
      [21.0000, -16.2000], // Ben Amira
      [20.9322, -17.0342]  // Nouadhibou (Port Minéralier)
    ];

    L.polyline(snimTrackPoints, {
      color: '#f59e0b',
      weight: 5,
      dashArray: '8, 10',
      opacity: 0.9
    }).addTo(map).bindPopup("<b>Réseau Ferroviaire SNIM</b><br/>Ligne Zouérate ↔ Nouadhibou (704 km)");

    // 3. FLOTTE DE LOCOMOTIVES EN CIRCULATION REAL-TIME
    let autoTrack = false;
    let audioContext = null;

    const trains = [
      {
        id: "SNIM-M1",
        name: "Train Minéralier Heavy 1",
        loco: "EMD SD70ACS (Triple Motrice)",
        wagons: 230,
        cargo: "Minerai de Fer (Hématite)",
        tonnage: "21 500 Tonnes",
        routeIndex: 0,
        direction: 1, // Descendant (Zouérate -> Nouadhibou)
        speed: 48,
        position: [...snimTrackPoints[0]],
        marker: null
      },
      {
        id: "SNIM-V2",
        name: "Train Retour Vides",
        loco: "EMD SD70ACS (Double Motrice)",
        wagons: 210,
        cargo: "Wagons Vides + Approvisionnement",
        tonnage: "3 200 Tonnes",
        routeIndex: snimTrackPoints.length - 1,
        direction: -1, // Remontant (Nouadhibou -> Zouérate)
        speed: 60,
        position: [...snimTrackPoints[snimTrackPoints.length - 1]],
        marker: null
      }
    ];

    // Création des marqueurs de trains
    trains.forEach(t => {
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="train-icon">🚂</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      t.marker = L.marker(t.position, { icon: icon }).addTo(map);
    });

    // Syntétiseur Audio pour le Bip d'alerte obstacle
    function playAlertBeep() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioContext.currentTime); // Note A5
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.4);
      } catch(e) {}
    }

    // 4. MOTEUR DE DÉPLACEMENT ET DÉTECTION D'OBSTACLES
    function updateTrainPositions() {
      let hasGlobalAlert = false;
      let alertMsg = "";

      trains.forEach((t, index) => {
        // Avancer sur le tracé
        t.routeIndex += t.direction * 0.15;

        // Gestion des terminus
        if (t.routeIndex >= snimTrackPoints.length - 1) {
          t.direction = -1;
          t.routeIndex = snimTrackPoints.length - 1;
        } else if (t.routeIndex <= 0) {
          t.direction = 1;
          t.routeIndex = 0;
        }

        // Interpolation de la position
        const idxLow = Math.floor(t.routeIndex);
        const idxHigh = Math.min(idxLow + 1, snimTrackPoints.length - 1);
        const ratio = t.routeIndex - idxLow;

        const p1 = snimTrackPoints[idxLow];
        const p2 = snimTrackPoints[idxHigh];

        const currentLat = p1[0] + (p2[0] - p1[0]) * ratio;
        const currentLng = p1[1] + (p2[1] - p1[1]) * ratio;
        
        t.position = [currentLat, currentLng];
        t.marker.setLatLng(t.position);

        // Simulation aléatoire d'obstacle sur la trajectoire (1 chance sur 4)
        const obstacleDetected = Math.random() < 0.25;
        let statusHTML = `<span style="color:#10b981; font-weight:bold;">✅ Voie Libre - Trajectoire dégagée</span>`;
        
        if (obstacleDetected) {
          hasGlobalAlert = true;
          const cause = Math.random() > 0.5 ? "Ensablement majeur de la voie" : "Présence de bétail / dromadaires sur les rails";
          statusHTML = `<span style="color:#ef4444; font-weight:bold;">⚠️ ALERTE OBSTACLE : ${cause} !</span>`;
          alertMsg = `${t.id} : ${cause}`;
        }

        // Contenu de la popup avec détails de la cargaison
        t.marker.bindPopup(`
          <div style="font-family: sans-serif; font-size: 13px; color: #0f172a; min-width: 200px;">
            <strong style="color: #d97706; font-size: 14px;">🚂 ${t.name} (${t.id})</strong><br/>
            <hr style="margin: 4px 0; border: 0; border-top: 1px solid #ccc;"/>
            <b>Locomotive :</b> ${t.loco}<br/>
            <b>Cargaison :</b> ${t.cargo}<br/>
            <b>Wagons :</b> ${t.wagons} wagons<br/>
            <b>Tonnage Total :</b> ${t.tonnage}<br/>
            <b>Vitesse Live :</b> ${t.speed} km/h<br/>
            <hr style="margin: 4px 0; border: 0; border-top: 1px solid #ccc;"/>
            <b>État Voie :</b> ${statusHTML}
          </div>
        `);
      });

      // Gestion des alertes globales et animations UI
      const topPanel = document.getElementById('topPanel');
      const panelTitle = document.getElementById('panelTitle');

      if (hasGlobalAlert) {
        topPanel.classList.add('alert-active');
        panelTitle.innerText = `🚨 OBSTACLE DÉTECTÉ !`;
        playAlertBeep();
      } else {
        topPanel.classList.remove('alert-active');
        panelTitle.innerText = `RADAR SNIM LIVE`;
      }

      // 5. RECENTRAGE DYNAMIQUE AUTOMATIQUE (SUR LE TRAIN 1)
      if (autoTrack) {
        map.panTo(trains[0].position, { animate: true, duration: 1.0 });
      }
    }

    function toggleAutoTrack() {
      autoTrack = !autoTrack;
      const btn = document.getElementById('btnAutoTrack');
      if (autoTrack) {
        btn.classList.add('active');
        btn.innerText = "🎥 SUIVI AUTO: ON";
        map.flyTo(trains[0].position, 10);
      } else {
        btn.classList.remove('active');
        btn.innerText = "🎥 SUIVI AUTO: OFF";
      }
    }

    // 6. GEOLOCALISATION UTILISATEUR
    let userMarker = null;
    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          autoTrack = false;
          document.getElementById('btnAutoTrack').classList.remove('active');
          document.getElementById('btnAutoTrack').innerText = "🎥 SUIVI AUTO: OFF";

          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([lat, lng], {
            radius: 9,
            color: '#ffffff',
            fillColor: '#059669',
            fillOpacity: 1
          }).addTo(map);

          userMarker.bindPopup("<b>📍 Votre Emplacement</b>").openPopup();
          map.flyTo([lat, lng], 13);
        });
      }
    }

    // Boucle d'actualisation de la télémétrie ferroviaire
    setInterval(updateTrainPositions, 4000);
  </script>
</body>
</html>
