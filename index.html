<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Terre & Vol en Direct</title>
  
  <!-- Moteur Globe 3D CesiumJS (Bibliothèques CDN officielles) -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Barre supérieure style cockpit / radar */
    .overlay-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .stats {
      font-size: 13px;
      color: #cbd5e1;
    }

    .refresh-btn {
      background: #0284c7;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: #0369a1;
    }

    /* Panneau de télémétrie du vol */
    #telemetryCard {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 1000;
      width: 280px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 16px;
      color: white;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-weight: bold;
      color: #38bdf8;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
    }

    .info-row {
      font-size: 13px;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    .info-row span {
      color: white;
      font-weight: 500;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <!-- Interface utilisateur -->
  <div class="overlay-panel">
    <div class="brand">
      <div class="pulse-dot"></div>
      RADAR SATELLITE LIVE
    </div>
    <div class="stats">
      Vols actifs : <strong id="flightCount">0</strong>
    </div>
    <button class="refresh-btn" onclick="fetchLiveFlights()">Actualiser</button>
  </div>

  <!-- Fiche d'information vol -->
  <div id="telemetryCard">
    <div class="card-header">
      <span id="flightCallsign">VOL N/A</span>
      <button class="close-btn" onclick="closeTelemetry()">✕</button>
    </div>
    <div class="info-row">Pays d'origine : <span id="flightCountry">-</span></div>
    <div class="info-row">Altitude : <span id="flightAltitude">-</span> m</div>
    <div class="info-row">Vitesse sol : <span id="flightSpeed">-</span> km/h</div>
    <div class="info-row">Cap : <span id="flightHeading">-</span>°</div>
  </div>

  <!-- Container du Globe 3D -->
  <div id="cesiumContainer"></div>

  <script>
    // Initialisation du globe 3D CesiumJS
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmMDRiNDU0MC1hOTVhLTQ1YTYtYWUzMC0xY2IwYzliYzI2NTIiLCJpZCI6MjU0OTE4LCJpYXQiOjE3MzE3MjkyNDZ9.mUSFz_f1i7cM7fXp6NqZ_M9KjA6O-u6-J1y0YfA0';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain(),
      animation: false,
      timeline: false,
      baseLayerPicker: true, // Permet d'alterner entre vue satellite HD, carte, etc.
      geocoder: true,        // Barre de recherche de ville / coordonnées précises sur Terre
      sceneModePicker: true,
      navigationHelpButton: false,
      homeButton: true
    });

    // Amélioration du rendu visuel de l'atmosphère et de la Terre
    viewer.scene.globe.enableLighting = true;

    const flightEntities = new Map();

    // Fonction de récupération des vols réels depuis l'API OpenSky Network
    async function fetchLiveFlights() {
      try {
        // Acquisition sur l'Europe/Afrique du Nord (zone à forte densité de trafic)
        const response = await fetch('https://opensky-network.org/api/states/all?lamin=20.0&lomin=-20.0&lamax=65.0&lomax=45.0');
        const data = await response.json();

        if (data && data.states) {
          const flights = data.states
            .slice(0, 250) // Limite pour garantir la fluidité du globe 3D
            .filter(f => f[5] !== null && f[6] !== null);

          document.getElementById('flightCount').innerText = flights.length;

          flights.forEach(flight => {
            const icao = flight[0];
            const callsign = flight[1] ? flight[1].trim() : 'INCONNU';
            const country = flight[2];
            const lon = flight[5];
            const lat = flight[6];
            const alt = flight[7] || 3000;
            const speed = flight[9] ? Math.round(flight[9] * 3.6) : 0;
            const heading = flight[10] || 0;

            const position = Cesium.Cartesian3.fromDegrees(lon, lat, alt);

            if (flightEntities.has(icao)) {
              // Mettre à jour la position existante
              const entity = flightEntities.get(icao);
              entity.position = position;
              entity.flightData = { callsign, country, alt, speed, heading };
            } else {
              // Créer un nouveau point radar d'avion sur la carte
              const entity = viewer.entities.add({
                id: icao,
                position: position,
                point: {
                  pixelSize: 7,
                  color: Cesium.Color.YELLOW,
                  outlineColor: Cesium.Color.BLACK,
                  outlineWidth: 1
                },
                label: {
                  text: callsign,
                  font: '10px sans-serif',
                  fillColor: Cesium.Color.WHITE,
                  outlineColor: Cesium.Color.BLACK,
                  outlineWidth: 2,
                  pixelOffset: new Cesium.Cartesian3(0, -12, 0),
                  distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 2000000)
                }
              });

              entity.flightData = { callsign, country, alt, speed, heading };
              flightEntities.set(icao, entity);
            }
          });
        }
      } catch (err) {
        console.error("Erreur de synchronisation du radar :", err);
      }
    }

    // Gestion du clic sur un avion pour afficher les données du vol
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (click) {
      const pickedObject = viewer.scene.pick(click.position);
      if (Cesium.defined(pickedObject) && pickedObject.id && pickedObject.id.flightData) {
        const data = pickedObject.id.flightData;
        document.getElementById('flightCallsign').innerText = 'VOL ' + data.callsign;
        document.getElementById('flightCountry').innerText = data.country;
        document.getElementById('flightAltitude').innerText = Math.round(data.alt);
        document.getElementById('flightSpeed').innerText = data.speed;
        document.getElementById('flightHeading').innerText = data.heading;
        document.getElementById('telemetryCard').style.display = 'block';
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    function closeTelemetry() {
      document.getElementById('telemetryCard').style.display = 'none';
    }

    // Chargement initial + rafraîchissement automatique toutes les 15s
    fetchLiveFlights();
    setInterval(fetchLiveFlights, 15000);
  </script>
</body>
</html>
