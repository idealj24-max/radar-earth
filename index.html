<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PCD 2.0 SNIM - Poste de Commandement Digital</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b131e;
      --card-bg: rgba(15, 23, 42, 0.92);
      --card-border: #1e293b;
      --accent-blue: #0284c7;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* MAP BACKGROUND */
    #map {
      width: 100%;
      height: 100vh;
      z-index: 1;
      transition: filter 0.3s ease;
    }

    /* AUTH LOCK SCREEN OVERLAY */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 11, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .auth-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-card {
      width: 90%;
      max-width: 420px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(2, 132, 199, 0.2);
      padding: 24px;
      animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-header i {
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .auth-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
    }

    .auth-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-logout {
      width: 100%;
      background: #334155;
      color: var(--accent-red);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    /* TOP BAR & CONTROL PANELS */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .agent-badge {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid var(--accent-blue);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'Orbitron', sans-serif;
    }

    .nav-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-transform: uppercase;
    }

    .nav-btn.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: #fca5a5;
    }

    .nav-btn.warning {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--accent-gold);
      color: #fcd34d;
    }

    /* DASHBOARD PANEL */
    .dashboard-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-height: 45vh;
      overflow-y: auto;
    }

    .panel-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--accent-gold);
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .data-item {
      background: rgba(30, 41, 59, 0.5);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
    }

    .data-item.alert {
      border-left-color: var(--accent-red);
    }

    .data-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .data-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    /* TOAST NOTIFICATIONS */
    .toast-container {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--accent-green);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      animation: fadeInOut 3s forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(-10px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- AUTH LOCK OVERLAY (Visible au démarrage par défaut) -->
  <div id="authModal" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-key"></i>
        <h2>AUTHENTIFICATION AGENT SNIM</h2>
        <p>Poste de Commandement Digital (PCD 2.0)</p>
      </div>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label for="agentMatricule">Matricule Agent SNIM :</label>
          <input type="text" id="agentMatricule" class="form-control" placeholder="Ex: AG-8492" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="agentRole">Rôle / Fonction :</label>
          <select id="agentRole" class="form-control">
            <option value="Conducteur Convoi Minéralier">Conducteur Convoi Minéralier</option>
            <option value="Régulateur Central (PCD)">Régulateur Central (PCD Nouadhibou/Zouérate)</option>
            <option value="Chef de Secteur Voies">Chef de Secteur Voies / Maintenance</option>
            <option value="Inspecteur Sécurité">Inspecteur Sécurité Ferroviaire</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">VALIDER LA SESSION</button>
        <button type="button" id="btnLogout" class="btn-logout" style="display:none;" onclick="logoutAgent()">DÉCONNEXION / CHANGER AGENT</button>
      </form>
    </div>
  </div>

  <!-- MAP CONTAINER -->
  <div id="map"></div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="status-row">
      <div class="app-title">
        <span class="status-dot"></span>
        <span>PCD 2.0 SNIM</span>
      </div>
      <div id="agentBadge" class="agent-badge">NON CONNECTÉ</div>
    </div>
    
    <div class="nav-buttons">
      <button class="nav-btn danger" onclick="showToast('Signalement d\'anomalie initié')"><i class="fa-solid fa-triangle-exclamation"></i> ANOMALIE</button>
      <button class="nav-btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="soundIcon"></i> SON : ON</button>
      <button class="nav-btn warning" onclick="showToast('Mode nuit activé')"><i class="fa-solid fa-moon"></i> NUIT</button>
      <button class="nav-btn" onclick="openAuthModal()"><i class="fa-solid fa-key"></i> AGENT</button>
    </div>
  </div>

  <!-- DASHBOARD PANEL -->
  <div class="dashboard-panel">
    <div class="panel-header">
      <i class="fa-solid fa-satellite-dish"></i> POSTE DE COMMANDEMENT SNIM
    </div>
    <div class="data-grid">
      <div class="data-item">
        <div class="data-label">Flotte IoT / Mode</div>
        <div class="data-value">Simulation Balises</div>
      </div>
      <div class="data-item">
        <div class="data-label">Vitesse Moyenne</div>
        <div class="data-value">48 km/h</div>
      </div>
      <div class="data-item">
        <div class="data-label">Tonnage Minéralier</div>
        <div class="data-value">21 500 T (Fer)</div>
      </div>
      <div class="data-item alert">
        <div class="data-label">Météo des Rails</div>
        <div class="data-value">47°C (MODÉRÉ)</div>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let currentUser = null;

    // 1. Initialisation de la carte au chargement du DOM
    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      checkAuthStatus();
    });

    function initMap() {
      // Centré sur le tracé de la voie ferrée SNIM (Mauritanie)
      map = L.map('map', { zoomControl: false }).setView([20.5123, -13.0245], 7);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'SNIM PCD 2.0 | Esri World Imagery',
        maxZoom: 18
      }).addTo(map);

      // Repères fictifs des PK (Points Kilométriques)
      L.marker([20.5123, -13.0245]).addTo(map).bindPopup("<b>PK 460 - Passe de Choum</b>");
      L.marker([22.6844, -12.4722]).addTo(map).bindPopup("<b>PK 704 - Zouérate Mine</b>");
    }

    // 2. Gestion de l'état d'authentification
    function checkAuthStatus() {
      const storedUser = localStorage.getItem("snim_agent_session");
      const authModal = document.getElementById("authModal");

      if (storedUser) {
        currentUser = JSON.parse(storedUser);
        updateUIForUser();
        authModal.classList.add("hidden"); // Cache le verrou d'accès
      } else {
        // Force l'affichage de l'écran de verrouillage
        openAuthModal(true);
      }
    }

    function openAuthModal(forceLock = false) {
      const authModal = document.getElementById("authModal");
      const btnLogout = document.getElementById("btnLogout");

      if (currentUser && !forceLock) {
        // Pré-remplir avec les informations actuelles si l'agent clique sur "AGENT"
        document.getElementById("agentMatricule").value = currentUser.matricule;
        document.getElementById("agentRole").value = currentUser.role;
        btnLogout.style.display = "block";
      } else {
        btnLogout.style.display = "none";
      }

      authModal.classList.remove("hidden");
    }

    function handleAuthSubmit(event) {
      event.preventDefault();

      const matricule = document.getElementById("agentMatricule").value.trim();
      const role = document.getElementById("agentRole").value;

      if (!matricule) return;

      currentUser = {
        matricule: matricule,
        role: role,
        loginTime: new Date().toISOString()
      };

      // Sauvegarde dans le LocalStorage pour persistance
      localStorage.setItem("snim_agent_session", JSON.stringify(currentUser));

      updateUIForUser();

      // Fermeture de la modale de verrouillage
      document.getElementById("authModal").classList.add("hidden");

      showToast(`Bienvenue Agent ${currentUser.matricule} !`);
    }

    function logoutAgent() {
      localStorage.removeItem("snim_agent_session");
      currentUser = null;

      document.getElementById("agentMatricule").value = "";
      document.getElementById("agentBadge").innerText = "NON CONNECTÉ";
      document.getElementById("agentBadge").style.borderColor = "var(--accent-red)";
      document.getElementById("agentBadge").style.color = "#fca5a5";

      showToast("Session fermée");
      openAuthModal(true);
    }

    function updateUIForUser() {
      if (!currentUser) return;
      const badge = document.getElementById("agentBadge");
      badge.innerText = `${currentUser.matricule} (${currentUser.role.split(' ')[0]})`;
      badge.style.borderColor = "var(--accent-blue)";
      badge.style.color = "#38bdf8";
    }

    // Utilitaires de test UI
    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerText = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    let isMuted = false;
    function toggleMute() {
      isMuted = !isMuted;
      const soundIcon = document.getElementById("soundIcon");
      soundIcon.className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
      showToast(isMuted ? "Son Désactivé" : "Son Activé");
    }
  </script>
</body>
</html>
