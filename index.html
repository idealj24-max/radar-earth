<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCD - SNIM Satellite Radar & AI Detection</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      background: #090d16;
    }

    /* Mode Nuit Radar / Infrarouge Tactical */
    .night-mode {
      filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(120%);
    }

    /* Panneau Supérieur */
    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(245, 158, 11, 0.5);
      padding: 10px 12px;
      border-radius: 12px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      transition: all 0.3s ease;
    }

    .top-panel.alert-active {
      animation: alertFlash 0.8s infinite alternate;
    }

    @keyframes alertFlash {
      from {
        background: rgba(220, 38, 38, 0.95);
        border-color: #ef4444;
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
      }
      to {
        background: rgba(15, 23, 42, 0.95);
        border-color: rgba(245, 158, 11, 0.5);
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #f59e0b;
      font-size: 13px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 1.2s infinite;
    }

    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #334155;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-active { background: #d97706 !important; }

    /* Panneau Télémétrique Latéral Rétractable */
    .side-panel {
      position: absolute;
      bottom: 25px;
      left: 10px;
      z-index: 1000;
      width: 280px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      color: white;
      padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .side-panel.collapsed {
      transform: translateX(-300px);
    }

    .side-toggle-btn {
      position: absolute;
      right: -36px;
      top: 10px;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .telemetry-item {
      margin-top: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }

    .telemetry-value {
      font-weight: bold;
      color: #38bdf8;
    }

    .train-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- Panneau supérieur de contrôle -->
  <div class="top-panel" id="topPanel">
    <div class="brand">
      <div class="pulse"></div>
      <span id="panelTitle">PCD SNIM - RADAR SATELLITE</span>
    </div>
    <div class="controls">
      <button class="btn" id="btnAudio" onclick="toggleAudio()">🔊 SON : ON</button>
      <button class="btn" id="btnNight" onclick="toggleNightMode()">🌙 NUIT</button>
      <button class="btn" id="btnTrack" onclick="toggleAutoTrack()">🎥 SUIVI</button>
      <button class="btn" onclick="locateUser()">🎯 GPS</button>
    </div>
  </div>

  <!-- Panneau Télémétrique Latéral Rétractable -->
  <div class="side-panel" id="sidePanel">
    <button class="side-toggle-btn" onclick="toggleSidePanel()">📊</button>
    <h4 style="color:#f59e0b; font-size:13px; margin-bottom:8px;">📊 TÉLÉMÉTRIE SATELLITE SNIM</h4>
    
    <div class="telemetry-item">
      <span>Analyse Cartographique :</span>
      <span class="telemetry-value" style="color:#10b981;">🛰️ Satellite Actif</span>
    </div>
    <div class="telemetry-item">
      <span>Locomotives Détectées :</span>
      <span class="telemetry-value" id="tActive">2 En Circulation</span>
    </div>
    <div class="telemetry-item">
      <span>Vitesse Moyenne Flotte :</span>
      <span class="telemetry-value" id="tAvgSpeed">52 km/h</span>
    </div>
    <div class="telemetry-item">
      <span>Tonnage Global Fer :</span>
      <span class="telemetry-value">21 500 Tonnes</span>
    </div>
    <div class="telemetry-item">
      <span>Port Minéralier :</span>
      <span class="telemetry-value">Nouadhibou</span>
    </div>
    <div class="telemetry-item">
      <span>Balayage Voie (704 km) :</span>
      <span class="telemetry-value" id="satScan">OK - 100% Visibilité</span>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. CARTE SATELLITE ARCGIS HD
    const map = L.map('map', { zoomControl: false }).setView([21.3000, -14.5000], 7);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'ArcGIS Satellite HD'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // 2. VOIE FERRÉE SNIM (704 KM ZOUÉRATE - NOUADHIBOU)
    const snimTrackPoints = [
      [22.7441, -12.4789], // Zouérate (Mines)
      [22.6800, -12.7000], // F'Dérik
      [22.1000, -12.8500], 
      [21.3000, -13.0000], // Choum
      [21.3200, -14.5000], // Pass de Choum
      [21.2000, -15.5000], 
      [21.0000, -16.2000], // Ben Amira
      [20.9322, -17.0342]  // Nouadhibou Port
    ];

    L.polyline(snimTrackPoints, {
      color: '#f59e0b',
      weight: 5,
      dashArray: '8, 10',
      opacity: 0.9
    }).addTo(map);

    // 3. PARAMÈTRES AUDIO & INTERFACE
    let soundEnabled = true;
    let nightMode = false;
    let autoTrack = false;
    let useRealGPS = false; // Mettre à true pour basculer sur le serveur GPS direct
    let audioContext = null;

    function playAlertSound() {
      if (!soundEnabled) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioContext.currentTime);
        gain.gain.setValueAtTime(0.25, audioContext.currentTime);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.35);
      } catch(e) {}
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('btnAudio').innerText = soundEnabled ? "🔊 SON : ON" : "🔇 MUTE";
    }

    function toggleNightMode() {
      nightMode = !nightMode;
      const mapDiv = document.getElementById('map');
      if (nightMode) {
        mapDiv.classList.add('night-mode');
        document.getElementById('btnNight').classList.add('btn-active');
      } else {
        mapDiv.classList.remove('night-mode');
        document.getElementById('btnNight').classList.remove('btn-active');
      }
    }

    function toggleSidePanel() {
      document.getElementById('sidePanel').classList.toggle('collapsed');
    }

    function toggleAutoTrack() {
      autoTrack = !autoTrack;
      document.getElementById('btnTrack').classList.toggle('btn-active', autoTrack);
    }

    // 4. LOCOMOTIVES SNIM
    const trains = [
      {
        id: "SNIM-M1",
        name: "Train Minéralier Heavy 1",
        loco: "EMD SD70ACS (Triple Motrice)",
        wagons: 230,
        cargo: "Minerai de Fer (Hématite)",
        tonnage: "21 500 T",
        routeIndex: 0,
        direction: 1,
        speed: 48,
        position: [...snimTrackPoints[0]],
        marker: null
      },
      {
        id: "SNIM-V2",
        name: "Train Convoyeur Vides 2",
        loco: "EMD SD70ACS (Double Motrice)",
        wagons: 210,
        cargo: "Wagons Vides + Approvisionnement",
        tonnage: "3 200 T",
        routeIndex: snimTrackPoints.length - 1,
        direction: -1,
        speed: 58,
        position: [...snimTrackPoints[snimTrackPoints.length - 1]],
        marker: null
      }
    ];

    trains.forEach(t => {
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="train-icon">🚂</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      t.marker = L.marker(t.position, { icon: icon }).addTo(map);
    });

    // 5. ANALYSE CARTOGRAPHIQUE SATELLITE EN DIRECT (DÉTECTION AUTOMATIQUE D'OBSTACLES)
    let obstacleSatelliteMarker = null;

    async function analyzeSatelliteImagery() {
      if (useRealGPS) {
        // En mode réel : appel de l'API de traitement d'images satellite (Sentinel-2 / InSAR)
        try {
          const response = await fetch('https://api-satellite-snim.com/v1/analyse-rails');
          const data = await response.json();
          if (data.obstacleDetected) {
            triggerSatelliteAlert(data.latitude, data.longitude, data.type);
          }
        } catch(e) {
          console.log("Flux satellite en cours d'initialisation...");
        }
      } else {
        // En mode démo : Simulation de détection par analyse spectrophotométrique satellite
        const isDuneDetected = Math.random() < 0.25; // 25% de chance de détection automatique d'ensablement
        if (isDuneDetected) {
          // Point kilométrique aléatoire le long des rails
          const randomIdx = Math.floor(Math.random() * (snimTrackPoints.length - 1));
          const lat = snimTrackPoints[randomIdx][0] + (Math.random() - 0.5) * 0.05;
          const lng = snimTrackPoints[randomIdx][1] + (Math.random() - 0.5) * 0.05;
          triggerSatelliteAlert(lat, lng, "Ensablement Majeur (Dune Mobile)");
        } else {
          clearSatelliteAlert();
        }
      }
    }

    function triggerSatelliteAlert(lat, lng, cause) {
      const topPanel = document.getElementById('topPanel');
      topPanel.classList.add('alert-active');
      document.getElementById('panelTitle').innerText = `🚨 IA SATELLITE : ${cause.toUpperCase()}`;
      document.getElementById('satScan').innerHTML = `<span style="color:#ef4444; font-weight:bold;">⚠️ ENSABLEMENT REPÉRÉ</span>`;
      
      playAlertSound();

      // Marqueur rouge d'obstacle sur la carte
      if (!obstacleSatelliteMarker) {
        obstacleSatelliteMarker = L.circleMarker([lat, lng], {
          radius: 12,
          color: '#ef4444',
          fillColor: '#dc2626',
          fillOpacity: 0.8
        }).addTo(map);
      } else {
        obstacleSatelliteMarker.setLatLng([lat, lng]);
      }
      obstacleSatelliteMarker.bindPopup(`<b style="color:red;">🛰️ ALERTE SATELLITE IA</b><br/>${cause}`).openPopup();
    }

    function clearSatelliteAlert() {
      const topPanel = document.getElementById('topPanel');
      topPanel.classList.remove('alert-active');
      document.getElementById('panelTitle').innerText = "PCD SNIM - RADAR SATELLITE";
      document.getElementById('satScan').innerHTML = `<span style="color:#10b981;">OK - 100% Visibilité</span>`;
      
      if (obstacleSatelliteMarker) {
        map.removeLayer(obstacleSatelliteMarker);
        obstacleSatelliteMarker = null;
      }
    }

    // 6. BOUCLE DE DÉPLACEMENT RÉEL / SIMULÉ
    function updatePositions() {
      if (!useRealGPS) {
        trains.forEach(t => {
          t.routeIndex += t.direction * 0.12;

          if (t.routeIndex >= snimTrackPoints.length - 1) { t.direction = -1; t.routeIndex = snimTrackPoints.length - 1; }
          else if (t.routeIndex <= 0) { t.direction = 1; t.routeIndex = 0; }

          const idx = Math.floor(t.routeIndex);
          const nextIdx = Math.min(idx + 1, snimTrackPoints.length - 1);
          const ratio = t.routeIndex - idx;

          const p1 = snimTrackPoints[idx];
          const p2 = snimTrackPoints[nextIdx];

          t.position = [p1[0] + (p2[0] - p1[0]) * ratio, p1[1] + (p2[1] - p1[1]) * ratio];
          t.marker.setLatLng(t.position);

          t.marker.bindPopup(`
            <div style="font-size:12px; font-family:sans-serif;">
              <b style="color:#d97706; font-size:13px;">🚂 ${t.name}</b><br/>
              <hr style="margin:4px 0; border:0; border-top:1px solid #ccc;"/>
              <b>ID Loco :</b> ${t.id}<br/>
              <b>Motrice :</b> ${t.loco}<br/>
              <b>Wagons :</b> ${t.wagons} wagons<br/>
              <b>Poids :</b> ${t.tonnage}<br/>
              <b>Vitesse :</b> ${t.speed} km/h
            </div>
          `);
        });

        if (autoTrack) {
          map.panTo(trains[0].position, { animate: true });
        }
      }

      // Lancer l'analyse automatique satellite à chaque cycle
      analyzeSatelliteImagery();
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          autoTrack = false;
          document.getElementById('btnTrack').classList.remove('btn-active');
          map.flyTo([p.coords.latitude, p.coords.longitude], 13);
        });
      }
    }

    // Rafraîchissement automatique toutes les 4 secondes
    setInterval(updatePositions, 4000);
  </script>
</body>
</html>
